brand:
  name: "TOPTIERclub"
  tagline: "Autonomous Multi-AI Quant Trading Arena"
  primary_color: "#007AFF"
  theme: "dark"
  language: "en"

trading:
  symbol: "XAUUSD"
  initial_equity: 10000.0
  contract_oz: 100
  min_lot: 0.01
  sim_min_lot: 0.001
  lot_step: 0.01
  max_lot: 2.00
  leverage: 100
  sessions:
    asian:
      start_utc: "00:00"
      end_utc: "07:00"
    london:
      start_utc: "07:00"
      end_utc: "16:00"
    new_york:
      start_utc: "12:00"
      end_utc: "21:00"
    overlap:
      start_utc: "12:00"
      end_utc: "16:00"

paper:
  base_spread_usd: 0.30
  news_spread_multiplier: 2.5
  slippage_usd: 0.08
  commission_per_lot_usd: 0.0
  limit_timeout_bars_h1: 8
  conservative_sl_first: true
  friday_close_hour_ny: 16
  friday_report_hour_ny: 17
  timezone_ny: "America/New_York"

risk_rules:
  default_risk_pct: 1.0
  min_risk_pct: 0.5
  max_risk_pct: 2.0
  min_rr: 2.0
  max_open_positions: 2
  max_trades_per_day: 3
  max_daily_loss_pct: 3.0
  max_weekly_loss_pct: 8.0
  max_margin_usage_pct: 30.0
  tilt_cooldown_losses: 2
  tilt_cooldown_hours: 4
  allow_scale_out: true
  allow_breakeven_after_tp1: true
  forbid_martingale: true
  forbid_averaging_down: true
  news_blackout_minutes_before: 45
  news_blackout_minutes_after: 45

kpi_targets:
  winrate_pct: 50.0
  profit_factor: 1.60
  sharpe_ratio: 1.20
  max_drawdown_pct: 5.0
  weekly_trades: 5

token_budget:
  grokbot_max_tokens_per_msg: 140
  grokbot_daily_token_cap: 12000
  debate_cooldown_minutes: 120
  hourly_pulse_minutes: 60

discord:
  channels:
    live_trades_env: "DISCORD_WEBHOOK_LIVE_TRADES"
    grokbot_floor_env: "DISCORD_WEBHOOK_GROKBOT"
    sunday_summit_env: "DISCORD_WEBHOOK_SUMMIT"
    macro_radar_env: "DISCORD_WEBHOOK_MACRO"

